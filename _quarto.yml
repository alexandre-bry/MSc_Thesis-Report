project:
  type: website

website:
  title: "MSc Thesis - Website"
  description: "Website for the MSc Thesis of Alexandre Bry for the MSc Geomatics"
  repo-url: https://github.com/alexandre-bry/MSc_Thesis-Report
  repo-actions: [edit, source, issue]
  open-graph: true

  navbar:
    background: primary
    search: true
    left:
      - text: "Weekly Meetings"
        href: weekly_notes/index.qmd
      - text: "Monthly Meetings"
        href: monthly_notes/index.qmd
      - text: "Reports"
        href: reports/index.qmd
    tools:
      - icon: github
        href: https://github.com/alexandre-bry/MSc_Thesis-Report

  sidebar:
    - title: "Weekly Meetings"
      style: "docked"
      contents:
        - weekly_notes/index.qmd
        - auto: "weekly_notes/*"
    - title: "Monthly Meetings"
      style: "docked"
      contents:
        - monthly_notes/index.qmd
        - auto: "monthly_notes/*"
    - title: "Reports"
      style: "docked"
      contents:
        - reports/index.qmd
        - reports/Project_proposal.qmd

  back-to-top-navigation: true
  page-navigation: true

lightbox: true
bibliography: references/MSc_Thesis-Bibliography.bib
author:
  - name: Alexandre Bry
    email: abry.pro@proton.me

format:
  html:
    theme:
      light: [flatly, theme_custom.scss]
      dark: [darkly, theme_custom.scss]
    respect-user-color-scheme: true
    toc: true
    toc-location: right
    link-external-icon: true
